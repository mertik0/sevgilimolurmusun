<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sevgilim olur musun?</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg1:#3a0f1e;--bg2:#1e0710;--rose:#f4b6c2;--cream:#fbeee9;--deep:#c2185b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 40%,var(--bg1),var(--bg2));color:var(--cream);font-family:'Jost',system-ui,sans-serif;overflow-x:hidden;overflow-y:auto}
#hearts,#burst{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}

.h{position:absolute;bottom:-60px;color:var(--rose);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(-12deg);opacity:0}10%{opacity:var(--o)}100%{transform:translateY(-115vh) rotate(14deg);opacity:0}}

main{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8rem;padding:2rem 1.5rem;text-align:center}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic;font-size:clamp(2.4rem,7vw,4.5rem);line-height:1.1;letter-spacing:.01em}

/* Tekli Fotoğraf Çerçevesi */
.photo-frame {
  background: rgba(251, 238, 233, 0.06);
  border: 1px solid rgba(244, 182, 194, 0.25);
  border-radius: 20px;
  padding: 0.8rem;
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 280px;
  width: 100%;
}
.photo-frame img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 14px;
  transition: opacity 0.5s ease;
}
.photo-frame span {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.2rem;
  font-style: italic;
  margin-top: 0.6rem;
  color: var(--rose);
}

.btns{display:flex;gap:1.2rem;margin-top:0.5rem}
button{font:500 1rem 'Jost',sans-serif;letter-spacing:.06em;padding:.9rem 2.6rem;border-radius:999px;cursor:pointer;transition:transform .2s,background .2s,color .2s}
button:focus-visible{outline:2px solid var(--rose);outline-offset:4px}
#yes{background:var(--rose);color:var(--bg2);border:1px solid var(--rose)}
#yes:hover{transform:scale(1.07)}
#no{background:transparent;color:var(--cream);border:1px solid rgba(251,238,233,.45)}
#no:hover{background:rgba(251,238,233,.1)}

.fly{position:absolute;left:50%;top:55%;color:var(--rose);animation:fly 2.4s cubic-bezier(.15,.7,.3,1) forwards;z-index:10}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(var(--s));opacity:0}}

.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.8rem;padding:1.5rem;text-align:center;background:radial-gradient(ellipse at 50% 40%,var(--bg1),var(--bg2));z-index:5}
.screen.on{display:flex;animation:fade .5s}
@keyframes fade{from{opacity:0}}
.screen img{max-width:min(80vw,360px);max-height:50vh;border-radius:14px;border:1px solid rgba(251,238,233,.25)}
.screen p{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(1.8rem,6vw,3rem)}
#yesScreen{background:transparent}
#yesScreen h2{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(2.4rem,8vw,5rem)}
.back{background:transparent;color:var(--cream);border:1px solid rgba(251,238,233,.45)}
@media (prefers-reduced-motion:reduce){.h{animation-duration:30s!important}}
</style>
</head>
<body>
<div id="hearts"></div>

<main id="home">
  <h1>Sevgilim olur musun?</h1>

  <!-- Tekli Değişen Fotoğraf Çerçevesi -->
  <div class="photo-frame">
    <img id="slideshow-img" src="kare.jpg" alt="Fotoğraf" onerror="this.src='https://via.placeholder.com/250?text=Fotoğraf'">
    <span id="slideshow-text">Kare</span>
  </div>

  <div class="btns">
    <button id="yes">Evet</button>
    <button id="no">Hayır</button>
  </div>
</main>

<div id="burst"></div>

<section class="screen" id="yesScreen">
  <img src="opucuk.webp" alt="Öpücük" onerror="this.style.display='none'">
  <h2>Seni çokkkk seviyorum, canım sevgilim ♥</h2>
</section>

<section class="screen" id="noScreen">
  <img src="elimidud.jpg" alt="" onerror="this.style.display='none'">
  <p>miyav..</p>
  <button class="back" id="back">🥺</button>
</section>

  e.style.animationDuration=(9+Math.random()*11)+'s';
  e.style.animationDelay=(-Math.random()*20)+'s';
  hs.appendChild(e);
}

  { src: 'konserve_acacagi.jpg', text: 'Konserve Açacağı' },
  { src: 'reel_sayilar.jpg', text: 'Reel Sayılar' }
];
